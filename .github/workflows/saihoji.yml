name: saihoji-watch
on:
  # Страховка: раз в час перезапускает цепочку, если она оборвалась.
  schedule:
    - cron: "52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "--loop | --test"
        default: "--loop"
permissions:
  contents: read
  actions: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if an older loop is running
        id: guard
        run: |
          for i in $(seq 12); do
            n=$(gh run list -R "$GITHUB_REPOSITORY" -w saihoji-watch -s in_progress -L 20 \
                  --json databaseId -q "[.[] | select(.databaseId < ${GITHUB_RUN_ID})] | length")
            [ "$n" -eq 0 ] && break
            sleep 15
          done
          echo "older running: $n"
          echo "skip=$([ "$n" -gt 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: steps.guard.outputs.skip == '0'
        with:
          path: saihoji-state.json
          key: saiho-${{ github.run_id }}
          restore-keys: saiho-
      - name: Watch
        if: steps.guard.outputs.skip == '0'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SAIHO_DATE: ${{ vars.SAIHO_DATE }}
          SAIHO_SEATS: ${{ vars.SAIHO_SEATS }}
          SAIHO_UNTIL: ${{ vars.SAIHO_UNTIL }}
          SAIHO_INTERVAL: ${{ vars.SAIHO_INTERVAL }}
          MODE: ${{ github.event.inputs.mode || '--loop' }}
        run: python3 -u saihoji_watch.py "$MODE"
      - uses: actions/cache/save@v4
        if: always() && steps.guard.outputs.skip == '0' && hashFiles('saihoji-state.json') != ''
        with:
          path: saihoji-state.json
          key: saiho-${{ github.run_id }}
      - name: Chain next run
        if: always() && steps.guard.outputs.skip == '0' && github.event.inputs.mode != '--test'
        run: |
          if [ -f SAIHO_DONE ]; then
            gh workflow disable saihoji-watch -R "$GITHUB_REPOSITORY"
          else
            gh workflow run saihoji-watch -R "$GITHUB_REPOSITORY"
          fi
