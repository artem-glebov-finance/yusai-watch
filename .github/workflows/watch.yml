name: yusai-watch
on:
  # Страховка: раз в час перезапускает цепочку, если она оборвалась.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "--loop | --test"
        default: "--loop"
permissions:
  contents: read
  actions: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if an older loop is running
        id: guard
        run: |
          # предыдущее звено цепочки ещё дорабатывает последний шаг — даём ему ~3 мин
          for i in $(seq 12); do
            n=$(gh run list -R "$GITHUB_REPOSITORY" -w yusai-watch -s in_progress -L 20 \
                  --json databaseId -q "[.[] | select(.databaseId < ${GITHUB_RUN_ID})] | length")
            [ "$n" -eq 0 ] && break
            sleep 15
          done
          echo "older running: $n"
          echo "skip=$([ "$n" -gt 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: steps.guard.outputs.skip == '0'
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Watch
        if: steps.guard.outputs.skip == '0'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DATES: ${{ secrets.DATES }}
          MIN_SEATS: ${{ vars.MIN_SEATS }}
          INTERVAL: ${{ vars.INTERVAL }}
          LOOP_MINUTES: ${{ vars.LOOP_MINUTES }}
          MODE: ${{ github.event.inputs.mode || '--loop' }}
        run: python3 -u yusai_watch.py "$MODE"
      - uses: actions/cache/save@v4
        if: always() && steps.guard.outputs.skip == '0' && hashFiles('state.json') != ''
        with:
          path: state.json
          key: state-${{ github.run_id }}
      - name: Chain next run
        if: always() && steps.guard.outputs.skip == '0' && github.event.inputs.mode != '--test'
        run: |
          if [ -f DONE ]; then
            gh workflow disable yusai-watch -R "$GITHUB_REPOSITORY"
          else
            gh workflow run yusai-watch -R "$GITHUB_REPOSITORY"
          fi
